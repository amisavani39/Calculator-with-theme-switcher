<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Calculator App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="theme-1">

  <main class="calculator">
    <header class="top">
      <h1>calc</h1>

      <div class="theme">
        <span>THEME</span>
        <div class="toggle">
          <div class="numbers">1 2 3</div>
          <input type="range" min="1" max="3" value="1" id="themeSwitch">
        </div>
      </div>
    </header>

    <div class="screen" id="display"></div>

    <div class="keypad">
      <button>7</button><button>8</button><button>9</button><button class="del">DEL</button>
      <button>4</button><button>5</button><button>6</button><button>+</button>
      <button>1</button><button>2</button><button>3</button><button>-</button>
      <button>.</button><button>0</button><button>/</button><button>x</button>
      <button class="reset">RESET</button>
      <button class="equal">=</button>
    </div>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
